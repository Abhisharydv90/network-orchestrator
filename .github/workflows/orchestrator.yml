name: Network Orchestrator

on:
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  orchestrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Orchestrator
        run: go build -o orchestrator ./cmd/orchestrator

      - name: Measure Latency
        id: latency
        run: |
          ./orchestrator measure https://wordpress.org > latency.json 2>&1 || true
          cat latency.json

      - name: Evaluate Last Error
        id: retry
        run: |
          ./orchestrator retry "socket hang up" > retry.json 2>&1 || true
          cat retry.json

      - name: Post Report to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: network-orchestrator
          message: |
            ## 🌐 Network Orchestrator Report

            ### 📡 Latency Measurement

$(cat latency.json)
### 🧠 Retry Decision (Sample Error)
$(cat retry.json)

---
