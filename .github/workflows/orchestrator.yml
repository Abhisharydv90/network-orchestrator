name: Network Orchestrator

on:
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  orchestrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Orchestrator
        run: go build -o orchestrator ./cmd/orchestrator

      - name: Measure Latency
        id: latency
        run: |
          echo "### 📡 Latency Measurement" > report.md
          echo '```' >> report.md
          ./orchestrator measure https://wordpress.org >> report.md 2>&1 || true
          echo '```' >> report.md
          echo "" >> report.md

      - name: Evaluate Last Error
        id: retry
        run: |
          echo "### 🧠 Retry Decision (Sample Error)" >> report.md
          echo '```' >> report.md
          ./orchestrator retry "socket hang up" >> report.md 2>&1 || true
          echo '```' >> report.md

      - name: Post Report to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: network-orchestrator
          path: report.md